name: Sync Obsidian fork from upstream

# sejune-oh/Obsidian_claude (fork, 이 자동화가 읽는 자료 소스)를
# 원본 SejuneOh/Obsidian_claude (upstream, 실제 편집처)와 매일 동기화한다.
#
# fork 는 순수 미러(독자 커밋 없음)여야 하며, 이 워크플로우는 fast-forward 로만 반영한다.
# fork 자체엔 아무 파일도 넣지 않기 위해 sync 는 이 Portfolio 저장소에서 원격으로 돌린다.
#
# 사전 준비(사용자, 1회):
#   - 두 저장소 모두 접근 가능한 PAT 를 만들어 이 저장소 Secret 에 OBSIDIAN_SYNC_TOKEN 로 등록.
#     · classic PAT: scope `repo`
#     · fine-grained PAT: SejuneOh/Obsidian_claude = Contents(Read),
#                         sejune-oh/Obsidian_claude = Contents(Read and write)
#       (fine-grained 는 두 계정 소유가 다르면 각 계정에서 각각 발급이 필요할 수 있음)

on:
  schedule:
    - cron: "30 23 * * *" # 매일 23:30 UTC (= 08:30 KST). article 발행 루틴보다 앞서 실행.
  workflow_dispatch: {} # 수동 실행(지금 바로 sync 하고 싶을 때)

permissions: {} # 기본 GITHUB_TOKEN 권한 불필요. 아래 PAT 로만 동작.

concurrency:
  group: sync-obsidian-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward fork main from upstream
        env:
          GH_TOKEN: ${{ secrets.OBSIDIAN_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::OBSIDIAN_SYNC_TOKEN secret 이 설정되지 않았습니다." >&2
            exit 1
          fi
          gh repo sync sejune-oh/Obsidian_claude \
            --source SejuneOh/Obsidian_claude \
            --branch main
